<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Craft energy 営業プラットフォーム</title>
<style>
  :root { box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #104183;
    color: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
      "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    -webkit-text-size-adjust: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 14px;
    padding: 28px 24px;
    box-shadow: 0 18px 40px rgba(0,0,0,.18);
  }
  h1 { margin: 0; font-size: 22px; text-align: center; }
  .sub { margin: 4px 0 0; text-align: center; font-size: 11px; letter-spacing: .18em; color: #94a3b8; }
  label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: #475569; }
  input[type=email], input[type=password] {
    width: 100%; padding: 11px 12px; font-size: 16px;
    border: 1px solid #e2e8f0; border-radius: 9px; background: #f8fafc;
  }
  input:focus { outline: none; border-color: #2563eb; background: #fff; box-shadow: 0 0 0 3px #dbeafe; }
  .field { margin-top: 16px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: #64748b; }
  button.primary {
    width: 100%; padding: 13px; margin-top: 18px; font-size: 15px; font-weight: 700;
    color: #fff; background: #104183; border: 0; border-radius: 9px; cursor: pointer;
  }
  button.primary:disabled { opacity: .4; cursor: not-allowed; }
  .err { margin-top: 14px; padding: 10px 12px; border-radius: 9px; background: #fff1f2; color: #be123c; font-size: 12px; }
  .note { margin-top: 20px; text-align: center; font-size: 11px; color: #94a3b8; line-height: 1.7; }
  .who { margin-top: 10px; text-align: center; font-size: 13px; color: #475569; }
  .choices { margin-top: 20px; display: grid; gap: 12px; }
  .choice {
    display: block; padding: 18px; border: 1px solid #e2e8f0; border-radius: 11px;
    text-decoration: none; color: inherit; background: #f8fafc; transition: .15s;
  }
  .choice:hover { background: #fff; border-color: #104183; }
  .choice .t { display: block; font-size: 16px; font-weight: 700; color: #104183; }
  .choice .d { display: block; margin-top: 4px; font-size: 12px; color: #64748b; line-height: 1.6; }
  .logout { margin-top: 18px; width: 100%; background: none; border: 0; color: #94a3b8; font-size: 12px; padding: 6px; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>Craft energy</h1>
  <p class="sub">SALES PLATFORM</p>

  <div id="loginBox">
    <div class="field">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label for="pass">合言葉</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" />
    </div>
    <label class="check"><input id="remember" type="checkbox" checked /> 次回から自動でログインする</label>
    <div id="err" class="err" hidden></div>
    <button class="primary" id="go">ログイン</button>
    <p class="note">合言葉がわからない場合は管理者にお問い合わせください。</p>
  </div>

  <div id="menuBox" hidden>
    <p class="who" id="who"></p>
    <div class="choices">
      <a class="choice" href="./log.html">
        <span class="t">営業ログ</span>
        <span class="d">日報の入力、商談管理、案件進捗、ランキング、各種分析</span>
      </a>
      <a class="choice" href="./navi.html">
        <span class="t">営業目標ナビ</span>
        <span class="d">月間目標から逆算した行動計画と、日々の振り返り</span>
      </a>
    </div>
    <button class="logout" id="logout">ログアウト</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   ここに Apps Script のウェブアプリURLを貼り付けてください
   （デプロイを管理 → ウェブアプリのURL。末尾が /exec のもの）
   ══════════════════════════════════════════ */
var API_URL = "https://script.google.com/macros/s/AKfycbynWR39HbLwEv7y-wv-otaoXSf4ApaLzSLK9loCrCP1rkF0e1C483fO-cnoM1bIocFinA/exec";
var TOKEN_KEY = "craft-sales-token";

function $(id) { return document.getElementById(id); }
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
function setToken(v) { try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {} }
function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

async function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (!API_URL || API_URL.indexOf("script.google.com") < 0) {
    throw new Error("接続先が設定されていません。index.html の API_URL を書き換えてください。");
  }
  var res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ fn: fn, args: args })
  });
  if (!res.ok) throw new Error("サーバーに接続できませんでした");
  var data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.result;
}

function roleLabel(me) {
  if (me.admin) return "管理者";
  return me.role === "closer" ? "クローザー" : "アポインター";
}

function showMenu(me) {
  $("loginBox").hidden = true;
  $("menuBox").hidden = false;
  $("who").textContent = me.name + " さん（" + roleLabel(me) + "）";
}

function showError(msg) {
  var e = $("err");
  e.textContent = msg;
  e.hidden = false;
}

/* 保存済みのログインがあれば、そのまま選択画面へ */
(async function () {
  var token = getToken();
  if (!token) return;
  $("go").disabled = true;
  try {
    var res = await api("resume", token);
    if (res && res.ok) {
      var next = new URLSearchParams(location.search).get("next");
      if (next === "navi") { location.href = "./navi.html"; return; }
      if (next === "log") { location.href = "./log.html"; return; }
      showMenu(res.me);
    } else {
      clearToken();
    }
  } catch (e) {}
  $("go").disabled = false;
})();

$("go").addEventListener("click", async function () {
  var email = $("email").value.trim();
  var pass = $("pass").value;
  if (!email || !pass) return;
  $("err").hidden = true;
  $("go").disabled = true;
  $("go").textContent = "確認しています…";
  try {
    var res = await api("login", email, pass);
    if (!res || !res.ok) {
      showError((res && res.message) || "ログインできませんでした");
    } else {
      if ($("remember").checked) setToken(res.token); else clearToken();
      var next = new URLSearchParams(location.search).get("next");
      if (next === "navi") { location.href = "./navi.html"; return; }
      if (next === "log") { location.href = "./log.html"; return; }
      showMenu(res.me);
    }
  } catch (e) {
    showError(e.message || "通信できませんでした");
  }
  $("go").disabled = false;
  $("go").textContent = "ログイン";
});

["email", "pass"].forEach(function (id) {
  $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });
});

$("logout").addEventListener("click", function () {
  clearToken();
  location.href = "./index.html";
});
</script>
</body>
</html>
